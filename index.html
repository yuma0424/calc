<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>スワイプ電卓</title>
<meta name="theme-color" content="#f2f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one-screen app — history scrolls on top, live result + expression in the middle, 4×5 keypad pinned to the bottom */
:root{
  --bg:#f2f3f1; --panel:#ffffff; --key:#e4e7e3; --key-fn:#d3d8d2; --op:#2f6f62; --op-fg:#ffffff;
  --fg:#1c2421; --muted:#6c7671; --line:#d9ddd8; --press:#c4cbc4;
  --f-num:ui-monospace,"Roboto Mono","SF Mono",Menlo,monospace;
  --f-ui:system-ui,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#181d1b; --key:#232a27; --key-fn:#2e3633; --op:#4fa592; --op-fg:#0d1210;
  --fg:#eef2ef; --muted:#8b9590; --line:#2a312e; --press:#3a4440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#181d1b; --key:#232a27; --key-fn:#2e3633; --op:#4fa592; --op-fg:#0d1210;
  --fg:#eef2ef; --muted:#8b9590; --line:#2a312e; --press:#3a4440; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box;gap:12px}
.display{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;touch-action:none}
.history{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-bottom:6px;border-bottom:1px solid var(--line);touch-action:pan-y}
.history[hidden]{display:none!important}
.history>:first-child{margin-top:auto}
.history .empty{color:var(--muted);font-size:13px;margin:auto 0 0;text-align:right}
.h-item{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:flex-end;padding:6px 4px;border-radius:8px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.h-item:hover,.h-item:focus-visible{background:var(--key)}
.h-item .e{font-size:13px;color:var(--muted);word-break:break-all;text-align:right}
.h-item .row{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:12px}
.h-item .tm{font-family:var(--f-ui);font-size:11px;color:var(--muted);white-space:nowrap}
.h-item .r{font-size:17px}
.result{font-family:var(--f-num);font-weight:300;text-align:right;white-space:nowrap;overflow:hidden;font-size:52px;line-height:1.1;min-height:1.1em;font-variant-numeric:tabular-nums}
.expr{font-family:var(--f-num);font-size:18px;color:var(--muted);text-align:right;word-break:break-all;min-height:1.4em;line-height:1.4}
.expr .caret{display:inline-block;width:2px;height:1.1em;background:var(--op);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.expr .caret{animation:none}}
.grip{flex:none;height:22px;margin-block:-6px;display:grid;place-items:center;cursor:ns-resize;touch-action:none}
.grip::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--line)}
.grip.drag::before{background:var(--op)}
.toast{position:fixed;left:50%;bottom:calc(50% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.keys{--kh:64px;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--kh) * .15)}
.k{all:unset;box-sizing:border-box;display:grid;place-items:center;height:var(--kh);width:100%;border-radius:calc(var(--kh) * .28);background:var(--key);color:var(--fg);font-family:var(--f-num);font-size:calc(var(--kh) * .4);cursor:pointer;transition:background .08s}
.k:focus-visible{outline:2px solid var(--op);outline-offset:2px}
.k.fn{background:var(--key-fn);font-family:var(--f-ui);font-size:calc(var(--kh) * .31);font-weight:500}
.k.op{background:var(--op);color:var(--op-fg);font-size:calc(var(--kh) * .44)}
.k:active,.k.down{background:var(--press)}
.k.op:active,.k.op.down{filter:brightness(1.15);background:var(--op)}
</style>
</head>
<body>


<div class="app">
  <div class="display" id="display">
    <div class="history" id="history"></div>
    <div class="result" id="result" title="長押しでコピー">0</div>
    <div class="expr" id="expr"></div>
  </div>
  <div class="grip" id="grip" role="separator" aria-label="上下にドラッグでキーの大きさを変更（ダブルタップで元に戻す）" title="上下にドラッグでキーの大きさを変更"></div>
  <div class="keys" id="keys">
    <button class="k fn" data-k="CE" id="k-ce">CE</button>
    <button class="k fn" data-k="%" id="k-pct">%</button>
    <button class="k fn" data-k="÷" id="k-frac" title="割る（÷と同じ）">/</button>
    <button class="k fn" data-k="Del" id="k-del">Del</button>
    <button class="k" data-k="7" id="k7">7</button>
    <button class="k" data-k="8" id="k8">8</button>
    <button class="k" data-k="9" id="k9">9</button>
    <button class="k op" data-k="÷" id="k-div">÷</button>
    <button class="k" data-k="4" id="k4">4</button>
    <button class="k" data-k="5" id="k5">5</button>
    <button class="k" data-k="6" id="k6">6</button>
    <button class="k op" data-k="×" id="k-mul">×</button>
    <button class="k" data-k="1" id="k1">1</button>
    <button class="k" data-k="2" id="k2">2</button>
    <button class="k" data-k="3" id="k3">3</button>
    <button class="k op" data-k="−" id="k-sub">−</button>
    <button class="k" data-k="0" id="k0">0</button>
    <button class="k" data-k="." id="k-dot">.</button>
    <button class="k fn" data-k="()" id="k-par" title="カッコ（開く／閉じるを自動で切替）">(</button>
    <button class="k op" data-k="+" id="k-add">+</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const OPS="+−×÷";
let expr="", redo=[], history=[];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
history=store.get("swcalc.history",[]);
/* 履歴は1ヶ月保存。日時のない古い履歴は今日の日付を付けて1ヶ月後に消える */
function prune(){const lim=new Date();lim.setMonth(lim.getMonth()-1);const t0=lim.getTime(),now=Date.now();
  history.forEach(h=>{if(!h.t)h.t=now;});history=history.filter(h=>h.t>=t0);if(history.length>5000)history=history.slice(-5000);store.set("swcalc.history",history);}
prune();
const WD="日月火水木金土";
function stamp(t){const d=new Date(t),p=n=>String(n).padStart(2,"0");return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`;}
let showHist=true;

/* ---------- parser: + − × ÷ ( ) %  ----------
   a + b%  → a × (1 + b/100)   a − b% → a × (1 − b/100)
   a × b%  → a × b / 100       b% alone → b / 100           */
function tokenize(s){
  const t=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      const n=s.slice(i,j);if((n.match(/\./g)||[]).length>1||n===".")throw 0;t.push({t:"n",v:parseFloat(n)});i=j;}
    else if(OPS.includes(c)||"()%/".includes(c)){t.push({t:c});i++;}
    else throw 0;}
  return t;}
function evaluate(s){
  const tk=tokenize(s);let p=0;
  const peek=()=>tk[p],eat=x=>{if(tk[p]&&tk[p].t===x){p++;return true}return false};
  function primary(){
    if(eat("−")){const r=primary();return {v:-r.v,pct:r.pct!=null?-r.pct:null}}
    if(eat("+"))return primary();
    let v;
    if(eat("(")){v=add();if(!eat(")"))throw 0;}
    else{const x=peek();if(!x||x.t!=="n")throw 0;p++;v=x.v;}
    if(eat("%"))return {v:v/100,pct:v};
    return {v,pct:null};}
  function mul(){
    let f=primary(),v=f.v,single=true,pct=f.pct;
    while(peek()&&(peek().t==="×"||peek().t==="÷")){
      const o=tk[p++].t,r=primary();single=false;
      if(o==="×")v*=r.v;else{if(r.v===0)throw "div0";v/=r.v;}}
    return {v,pct:single?pct:null};}
  function add(){
    let v=mul().v;
    while(peek()&&(peek().t==="+"||peek().t==="−")){
      const o=tk[p++].t,r=mul();
      const d=r.pct!=null?v*r.pct/100:r.v;
      v=o==="+"?v+d:v-d;}
    return v;}
  const v=add();if(p!==tk.length)throw 0;return v;}
function liveValue(s){
  let x=s.replace(/[+−×÷(]+$/,"");
  if(!x)return null;
  const open=(x.match(/\(/g)||[]).length-(x.match(/\)/g)||[]).length;
  if(open>0)x+=")".repeat(open);
  try{return evaluate(x)}catch(e){return e==="div0"?"err":null}}

/* ---------- formatting ---------- */
function fmtNum(n){
  if(n==="err"||!isFinite(n))return "エラー";
  if(Object.is(n,-0))n=0;
  const a=Math.abs(n);
  if(a!==0&&(a>=1e15||a<1e-9)){return n.toExponential(8).replace(/\.?0+e/,"e").replace("e+","e")}
  const r=Number(n.toPrecision(14));
  return r.toLocaleString("en-US",{maximumFractionDigits:10});}
function fmtExpr(s){
  return s.replace(/[0-9.]+/g,m=>{const [i,f]=m.split(".");
    const g=i?Number(i).toLocaleString("en-US"):"";
    return m.includes(".")?(g||"0")+"."+f:g;})
   .replace(/([+−×÷])/g," $1 ").replace(/\s+/g," ").trim();}

/* ---------- render ---------- */
function fit(el,max){el.style.fontSize=max+"px";let s=max;
  while(el.scrollWidth>el.clientWidth&&s>20){s-=2;el.style.fontSize=s+"px";}}
function render(){
  const v=liveValue(expr);
  $("result").textContent=expr===""?"0":(v===null?$("result").dataset.last||"0":fmtNum(v));
  if(v!==null)$("result").dataset.last=fmtNum(v);
  if(expr==="")$("result").dataset.last="0";
  $("expr").innerHTML="";
  $("expr").append(document.createTextNode(fmtExpr(expr)));
  const c=document.createElement("span");c.className="caret";$("expr").append(c);
  fit($("result"),52);
  const h=$("history");h.hidden=!showHist;h.innerHTML="";
  if(!history.length){const e=document.createElement("p");e.className="empty";e.textContent="CEを押すと計算が履歴に残ります";h.append(e);}
  history.forEach((it,i)=>{const b=document.createElement("button");b.className="h-item";b.id="h-"+i;
    b.innerHTML='<span class="e"></span><span class="row"><span class="tm"></span><span class="r"></span></span>';
    b.querySelector(".e").textContent=fmtExpr(it.e);b.querySelector(".r").textContent="= "+it.r;
    b.querySelector(".tm").textContent=it.t?stamp(it.t):"";
    b.addEventListener("click",()=>{expr=it.e;redo=[];render();toast("式を呼び出しました")});h.append(b);});
  h.scrollTop=h.scrollHeight;}

/* ---------- input ---------- */
function lastNumber(){const m=expr.match(/[0-9.]+$/);return m?m[0]:"";}
function press(k){
  const last=expr.slice(-1);
  if(/^\d+$/.test(k)){
    const n=lastNumber();
    if(last===")"||last==="%")expr+="×";
    if(n==="0"&&!n.includes("."))expr=expr.slice(0,-1);
    if(k==="00"&&(lastNumber()===""))k="0";
    if(lastNumber().replace(".","").length>=15)return;
    expr+=k;}
  else if(k==="."){const n=lastNumber();if(n.includes("."))return;
    if(last===")"||last==="%")expr+="×";
    expr+=n===""?"0.":".";}
  else if(OPS.includes(k)){
    if(expr===""){if(k==="−")expr="−";else{const prev=history[history.length-1];if(prev&&prev.v!=null){expr=String(prev.v).replace("-","−")+k}}return done();}
    if(last==="("){if(k==="−")expr+="−";return done();}
    if(OPS.includes(last))expr=expr.slice(0,-1)+(expr.length===1&&k!=="−"?"":k);
    else expr+=k;}
  else if(k==="%"){if(/[0-9)]/.test(last))expr+="%";}
  else if(k==="()"){
    const open=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;
    if(open>0&&/[0-9)%]/.test(last))expr+=")";
    else{if(/[0-9)%]/.test(last))expr+="×";expr+="(";}}
  else if(k==="Del"){if(expr){redo.push(expr.slice(-1));expr=expr.slice(0,-1);} return render();}
  else if(k==="CE"){commit();return;}
  done();}
function done(){redo=[];render();}
function commit(){
  const v=liveValue(expr);
  if(expr&&v!==null&&v!=="err"&&/[+−×÷%]/.test(expr.replace(/^−/,""))){
    history.push({e:expr.replace(/[+−×÷(]+$/,""),r:fmtNum(v),v:Number(v.toPrecision(14)),t:Date.now()});
    prune();}
  expr="";redo=[];render();}
$("keys").addEventListener("click",e=>{const b=e.target.closest(".k");if(b)press(b.dataset.k);});

/* keyboard */
const keymap={"*":"×","/":"÷","-":"−","+":"+","Backspace":"Del","Escape":"CE","Enter":"CE","%":"%",".":".","(":"()",")":"()"};
document.addEventListener("keydown",e=>{let k=/^\d$/.test(e.key)?e.key:keymap[e.key];if(!k)return;e.preventDefault();press(k);});

/* ---------- gestures on the display ---------- */
let sx=0,sy=0,st=0,onResult=false,startedOnHistory=false;
const disp=$("display");
disp.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;st=Date.now();onResult=e.target===$("result");
  startedOnHistory=!!e.target.closest(".history");});
disp.addEventListener("pointerup",e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy,dt=Date.now()-st;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){
    if(dx<0){if(expr){redo.push(expr.slice(-1));expr=expr.slice(0,-1);render();}}
    else if(redo.length){expr+=redo.pop();render();}
    return;}
  if(onResult&&dt>500&&Math.abs(dx)<10&&Math.abs(dy)<10){
    const txt=$("result").textContent.replace(/,/g,"");
    const ok=()=>toast("コピーしました："+txt);
    try{navigator.clipboard.writeText(txt).then(ok,()=>toast("コピーできませんでした"));}catch(err){toast("コピーできませんでした");}}
});
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1400);}

window.addEventListener("resize",()=>fit($("result"),52));

/* ---------- grip: drag to resize keys (more/less history) ---------- */
const KMIN=42,KMAX=84,KDEF=64,keys=$("keys"),grip=$("grip");
let kh=store.get("swcalc.kh",KDEF);
function setKh(v,save){kh=Math.max(KMIN,Math.min(KMAX,Math.round(v)));keys.style.setProperty("--kh",kh+"px");fit($("result"),52);if(save)store.set("swcalc.kh",kh);}
setKh(kh);
let gy=null,gk=0,lastTap=0;
grip.addEventListener("pointerdown",e=>{gy=e.clientY;gk=kh;grip.setPointerCapture(e.pointerId);grip.classList.add("drag");});
grip.addEventListener("pointermove",e=>{if(gy===null)return;setKh(gk+(gy-e.clientY)/5);});
grip.addEventListener("pointerup",e=>{
  const moved=Math.abs(e.clientY-gy)>4;gy=null;grip.classList.remove("drag");
  if(!moved){const now=Date.now();if(now-lastTap<350){setKh(KDEF,true);toast("キーの大きさを元に戻しました");}lastTap=now;}
  store.set("swcalc.kh",kh);});
grip.addEventListener("pointercancel",()=>{gy=null;grip.classList.remove("drag");});
if(!store.get("swcalc.gripTip",false)){setTimeout(()=>toast("キー上のバーを下にドラッグすると履歴が広がります"),600);store.set("swcalc.gripTip",true);}
render();
})();
</script>

<script>
if("serviceWorker" in navigator){
  // 更新があれば自動で新しい版に切り替える（開いた直後に1回だけ読み直す）
  const had=!!navigator.serviceWorker.controller;let done=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!done){done=true;location.reload();}});
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});});
}
</script>
</body>
</html>
